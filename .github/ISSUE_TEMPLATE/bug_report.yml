name: Bug report
description: Report a reproducible offline audit failure
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Command and minimal synthetic input
      description: Include Python version. Redact private data and credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
